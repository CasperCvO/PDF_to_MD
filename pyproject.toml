[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-to-md"
version = "0.6.0"
description = "Batch-convert PDFs and office documents to Markdown with structure mirroring, image extraction, and Gemini vision-based slide extraction"
readme = "README.md"
authors = [{ name = "CasperCvO" }]
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.34.0",
    "lxml>=5",
    "markitdown[docx,xlsx,pptx]>=0.1.0",
    "openpyxl>=3.1",
    "pillow>=10.0.0",
    "pymupdf>=1.25.0",
    "python-pptx>=0.6.23",
]

[project.urls]
Homepage = "https://github.com/CasperCvO/PDF_to_MD"
Repository = "https://github.com/CasperCvO/PDF_to_MD"

[project.scripts]
pdf-to-md = "pdf_to_md.main:main"
pdf-to-md-vision = "pdf_to_md.vision_converter:main"
merge-pdfs = "pdf_to_md.merge_pdfs:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_to_md"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
