[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-to-md"
version = "0.1.0"
description = "Batch-convert PDFs and office documents to Markdown with structure mirroring and image extraction"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "markitdown[docx,xlsx,pptx]>=0.1.0",
    "pymupdf-layout>=1.27.1",
    "pymupdf4llm>=0.2.9",
]

[project.scripts]
pdf-to-md = "pdf_to_md.main:main"
merge-pdfs = "pdf_to_md.merge_pdfs:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_to_md"]
